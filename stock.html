<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NyondoStock - Stock Registration</title>

    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            display: flex;
            background-color: #f4f6f9;
            min-height: 100vh;
        }

        /* side bar*/
        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: linear-gradient(180deg, #1a73e8 0%, #0d47a1 100%);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            box-shadow: 3px 0 10px rgba(0, 0, 0, 0.2);
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            background-color: rgba(0, 0, 0, 0.1);
        }

        .sidebar-header h4 {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            margin: 0;
            letter-spacing: 1px;
        }

        .sidebar-header span {
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
        }

        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.5);
            margin-bottom: 10px;
        }

        .profile p {
            font-weight: bold;
            font-size: 14px;
            color: #ffffff;
            margin: 0;
        }

        .profile span {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            background-color: rgba(255, 255, 255, 0.15);
            padding: 2px 10px;
            border-radius: 10px;
            margin-top: 4px;
        }

        .nav-section {
            padding: 10px 0;
            flex: 1;
        }

        .nav-label {
            padding: 8px 20px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-left: 3px solid #ffffff;
            color: #ffffff;
        }

        .nav-item.active {
            background-color: rgba(255, 255, 255, 0.2);
            border-left: 3px solid #ffffff;
            color: #ffffff;
            font-weight: bold;
        }

        .nav-item i {
            font-size: 16px;
            width: 20px;
        }

        /* main */
        .main {
            flex: 1;
            padding: 30px 25px;
            overflow-y: auto;
        }

        .page-header h3 {
            font-size: 22px;
            color: #222;
            font-weight: bold;
            margin: 0 0 4px;
        }

        .breadcrumb-bar {
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }

        .breadcrumb-bar a {
            color: #1a73e8;
            text-decoration: none;
        }

        /*card form */
        .form-card {
            background-color: #ffffff;
            border-radius: 12px;
            max-width: 700px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .card-header-bar {
            background: linear-gradient(90deg, #1a73e8, #0d47a1);
            padding: 18px 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-header-bar h2 {
            color: #ffffff;
            font-size: 18px;
            margin: 0;
            font-weight: bold;
        }

        .card-header-bar i {
            color: #ffffff;
            font-size: 22px;
        }

        .card-body-content {
            padding: 28px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 13px;
            color: #1a73e8;
            margin: 20px 0 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e8f0fe;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control,
        .form-select {
            font-size: 13px;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: #fafafa;
            transition: all 0.2s;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #1a73e8;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        .required {
            color: red;
            margin-left: 2px;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 14px;
            pointer-events: none;
        }

        .input-icon input {
            padding-right: 36px;
        }

        .button-row {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .btn-cancel-custom {
            padding: 11px 24px;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: #555;
            transition: all 0.2s;
        }

        .btn-cancel-custom:hover {
            background-color: #f5f5f5;
        }

        .btn-submit-custom {
            padding: 11px 28px;
            background: linear-gradient(90deg, #1a73e8, #0d47a1);
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-submit-custom:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.4);
        }
    </style>
</head>

<body>

    <!-- side bar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h4>NyondoStock</h4>
            <span>Inventory System</span>
        </div>

        <div class="profile">
            <img src="picture.jpg" alt="Profile" class="avatar"
                onerror="this.src='https://ui-avatars.com/api/?name=Namiiro+Angella&background=ffffff&color=1a73e8&size=70'">
            <p>Namiiro Angella</p>
            <span>Admin</span>
        </div>

        <div class="nav-section">
            <div class="nav-label">Main Menu</div>
            <div class="nav-item">
                <i class="bi bi-speedometer2"></i> Dashboard
            </div>
            <div class="nav-item">
                <i class="bi bi-cart3"></i> Sales Management
            </div>
            <div class="nav-item">
                <i class="bi bi-truck"></i> Supplier Management
            </div>
            <div class="nav-item active">
                <i class="bi bi-box-seam"></i> Stock Management
            </div>
            <div class="nav-item">
                <i class="bi bi-car-front"></i> Transport Management
            </div>
        </div>
    </div>

    <!-- main content -->
    <div class="main">

        <div class="page-header mb-1">
            <h3><i class="bi bi-box-seam me-2 text-primary"></i>Stock Management</h3>
        </div>
        <div class="breadcrumb-bar">
            <a href="#">Dashboard</a> /
            <a href="#">Stock Management</a> /
            Register Stock
        </div>

        <div class="form-card">

            <div class="card-header-bar">
                <i class="bi bi-plus-circle"></i>
                <h2>Stock Registration Form</h2>
            </div>

            <div class="card-body-content">
                <form id="stock-form">

                    <!-- Product Details -->
                    <div class="section-title">
                        <i class="bi bi-tag"></i> Product Details
                    </div>

                    <div class="row g-3 mb-2">
                        <div class="col-md-6">
                            <label class="form-label">Product ID <span class="required">*</span></label>
                            <div class="input-icon">
                                <input type="text" class="form-control" id="product-id" placeholder="e.g. PRD-001"
                                    required>
                                <i class="bi bi-upc"></i>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Product Name <span class="required">*</span></label>
                            <input type="text" class="form-control" id="product-name" placeholder="Enter product name"
                                required>
                        </div>
                    </div>

                    <div class="row g-3 mb-2">
                        <div class="col-md-6">
                            <label class="form-label">Category <span class="required">*</span></label>
                            <select class="form-select" id="category" required>
                                <option value="">Select category</option>
                                <option value="electronics">Electronics</option>
                                <option value="furniture">Furniture</option>
                                <option value="clothing">Clothing</option>
                                <option value="food">Food & Beverages</option>
                                <option value="stationery">Stationery</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Unit of Measure <span class="required">*</span></label>
                            <select class="form-select" id="unit" required>
                                <option value="">Select unit</option>
                                <option value="pieces">Pieces</option>
                                <option value="kgs">Kilograms (Kgs)</option>
                                <option value="litres">Litres</option>
                                <option value="boxes">Boxes</option>
                                <option value="cartons">Cartons</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-2">
                        <div class="col-12">
                            <label class="form-label">Product Description</label>
                            <textarea class="form-control" id="description"
                                placeholder="Enter product description..."></textarea>
                        </div>
                    </div>

                    <!-- Stock Details -->
                    <div class="section-title">
                        <i class="bi bi-archive"></i> Stock Details
                    </div>

                    <div class="row g-3 mb-2">
                        <div class="col-md-4">
                            <label class="form-label">Quantity <span class="required">*</span></label>
                            <input type="number" class="form-control" id="quantity" placeholder="0" min="0" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Unit Price (UGX) <span class="required">*</span></label>
                            <div class="input-icon">
                                <input type="number" class="form-control" id="unit-price" placeholder="0.00" min="0"
                                    required>
                                <i class="bi bi-cash"></i>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Reorder Level <span class="required">*</span></label>
                            <input type="number" class="form-control" id="reorder-level" placeholder="Min stock level"
                                min="0" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-2">
                        <div class="col-md-6">
                            <label class="form-label">Date Received <span class="required">*</span></label>
                            <input type="date" class="form-control" id="date-received" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Expiry Date</label>
                            <input type="date" class="form-control" id="expiry-date">
                        </div>
                    </div>

                    <!-- Supplier Details -->
                    <div class="section-title">
                        <i class="bi bi-truck"></i> Supplier Details
                    </div>

                    <div class="row g-3 mb-2">
                        <div class="col-md-6">
                            <label class="form-label">Supplier Name <span class="required">*</span></label>
                            <select class="form-select" id="supplier" required>
                                <option value="">Select supplier</option>
                                <option value="sup1">Kampala Hardware Ltd</option>
                                <option value="sup2">Uganda Distributors Co.</option>
                                <option value="sup3">East Africa Supplies</option>
                                <option value="sup4">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Batch Number</label>
                            <input type="text" class="form-control" id="batch-number" placeholder="e.g. BATCH-2024-001">
                        </div>
                    </div>

                    <div class="row g-3 mb-2">
                        <div class="col-md-6">
                            <label class="form-label">Storage Location</label>
                            <input type="text" class="form-control" id="storage-location"
                                placeholder="e.g. Warehouse A, Shelf 3">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Stock Status <span class="required">*</span></label>
                            <select class="form-select" id="stock-status" required>
                                <option value="">Select status</option>
                                <option value="available">Available</option>
                                <option value="low">Low Stock</option>
                                <option value="out">Out of Stock</option>
                                <option value="damaged">Damaged</option>
                            </select>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="button-row">
                        <button class="btn-cancel-custom" type="button">Cancel</button>
                        <button class="btn-submit-custom" type="submit">
                            <i class="bi bi-check-circle"></i> Register Stock
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
