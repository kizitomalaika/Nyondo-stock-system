name: NyondoStock Pipeline

on:
  push:
    branches:
      - development
      - staging
      - main

jobs:

  #  JOB 1 — TEST ON DEVELOPMENT ─
  test:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run Selenium tests
        run: |
          pytest test_stock.py -v -s --html=report.html

      - name: Upload test report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-report
          path: report.html

  # JOB 2 — DEPLOY TO STAGING ─
  deploy-staging:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/development'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Merge development into staging
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin
          git checkout staging
          git merge development --no-ff -m "pipeline merge development into staging"
          git push origin staging

  # ─ JOB 3 — TEST ON STAGING ─
  test-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run Selenium tests on staging
        run: |
          pytest test_stock.py -v -s --html=report.html

      - name: Upload staging test report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: staging-test-report
          path: report.html

  # ─ JOB 4 — DEPLOY TO MAIN ─
  deploy-main:
    runs-on: ubuntu-latest
    needs: test-staging
    if: github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Merge staging into main
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin
          git checkout main
          git merge staging --no-ff -m "pipeline merge staging into main"
          git push origin main

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./